<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trooper Architecture Flow</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="canvas" id="canvas">
    <!-- Top Pill: Current State / Action -->
    <div class="flow-status" id="flowStatus">
      <span class="status-dot"></span>
      <span class="status-text" id="statusText">1. Cold Request: Cache Miss</span>
    </div>

    <!-- The 3 Core Blocks -->
    <div class="flow-container">
      <!-- 1. FLUTTER UI -->
      <div class="card card-ui" id="cardUi">
        <div class="card-icon">📱</div>
        <div class="card-body">
          <div class="card-title">Flutter UI</div>
          <div class="card-subtitle">Presentation Layer</div>
        </div>
        <div class="state-pill" id="uiStatePill">
          <span class="pill-dot"></span>
          <span class="pill-text" id="uiStateText">DataInitial()</span>
        </div>
      </div>

      <!-- Track 1: UI to Trooper -->
      <div class="arrow-track" id="trackUiTrooper">
        <!-- Top: Request -->
        <div class="track-line track-top">
          <span class="track-label label-req" id="labelReq">.get()</span>
          <div class="track-arrow arrow-right">›</div>
          <div class="particle particle-right" id="pReq"></div>
        </div>
        <!-- Bottom: State -->
        <div class="track-line track-bottom">
          <span class="track-label label-state" id="labelState">StatefulData</span>
          <div class="track-arrow arrow-left">‹</div>
          <div class="particle particle-left" id="pState"></div>
        </div>
      </div>

      <!-- 2. TROOPER (Core Engine) -->
      <div class="card card-trooper" id="cardTrooper">
        <div class="card-badge">ENGINE</div>
        <div class="card-icon icon-trooper">⚡</div>
        <div class="card-body">
          <div class="card-title">Trooper</div>
          <div class="card-subtitle">SWR & Multi-Tier Cache</div>
        </div>
        <div class="trooper-pill" id="trooperPill">
          <span id="trooperPillText">L1 Memory Cache</span>
        </div>
      </div>

      <!-- Track 2: Trooper to API -->
      <div class="arrow-track" id="trackTrooperApi">
        <!-- Top: Fetch -->
        <div class="track-line track-top">
          <span class="track-label label-fetch" id="labelFetch">fetch()</span>
          <div class="track-arrow arrow-right">›</div>
          <div class="particle particle-right" id="pFetch"></div>
        </div>
        <!-- Bottom: Payload -->
        <div class="track-line track-bottom">
          <span class="track-label label-payload" id="labelPayload">200 OK</span>
          <div class="track-arrow arrow-left">‹</div>
          <div class="particle particle-left" id="pPayload"></div>
        </div>
      </div>

      <!-- 3. REMOTE API -->
      <div class="card card-api" id="cardApi">
        <div class="card-icon">🌐</div>
        <div class="card-body">
          <div class="card-title">Remote API</div>
          <div class="card-subtitle">REST / GraphQL</div>
        </div>
        <div class="api-pill" id="apiPill">
          <span class="api-dot" id="apiDot"></span>
          <span id="apiPillText">Idle</span>
        </div>
      </div>
    </div>

    <!-- Bottom Note / Value Proposition -->
    <div class="flow-footer" id="flowFooter">
      Zero-Flicker SWR Guarantee: <code>DataRefreshing</code> extends <code>DataLoaded</code>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
